<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Raíz & Pixel Convites — Painel de Gestão. Acesso restrito.">
  <title>Login — Raíz & Pixel</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-logo">
        <h1>Raíz &amp; Pixel</h1>
        <p>Painel de Gestão</p>
      </div>

      <div class="login-divider"></div>

      <!-- Form -->
      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-password">Senha de acesso</label>
          <input
            type="password"
            id="login-password"
            placeholder="Digite a senha"
            required
            autofocus
          >
        </div>

        <div class="login-error" id="login-error">
          Senha incorreta. Tente novamente.
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>

  <script>
    // Se já autenticado, redireciona direto
    if (Auth.isAuthenticated()) {
      window.location.href = 'app.html';
    }

    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('login-password');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const password = passwordInput.value.trim();

      if (Auth.login(password)) {
        // Login bem-sucedido — redireciona
        window.location.href = 'app.html';
      } else {
        // Senha incorreta
        errorEl.classList.add('visible');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
